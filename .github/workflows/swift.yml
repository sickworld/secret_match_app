name: iOS Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ios-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PROJECT: SecretMatch.xcodeproj
  PARTICIPANT_SCHEME: SecretMatch
  ADMIN_SCHEME: SecretMatch Admin
  COVERAGE_THRESHOLD: "80.0"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  quality:
    name: Code quality
    runs-on: macos-26
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare quality report
        run: |
          mkdir -p artifacts
          touch artifacts/swiftformat.log

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftformat --version

      - name: Check repository hygiene and project versions
        run: |
          set -euo pipefail

          forbidden_files="$(git ls-files | grep -E '(^|/)xcuserdata/|\.xcuserstate$|\.p12$|\.mobileprovision$' || true)"
          if [[ -n "$forbidden_files" ]]; then
            echo "::error::Unzulässige lokale oder Signing-Dateien sind versioniert."
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

          if git grep -n -E '^(<<<<<<<|>>>>>>>)' -- '*.swift' '*.yml' '*.yaml' '*.md'; then
            echo "::error::Nicht aufgelöste Merge-Marker gefunden."
            exit 1
          fi

          build_versions="$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([^;]*\);/\1/p' "$PROJECT/project.pbxproj" | sort -u)"
          marketing_versions="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' "$PROJECT/project.pbxproj" | sort -u)"
          build_count="$(grep -c 'CURRENT_PROJECT_VERSION =' "$PROJECT/project.pbxproj")"
          marketing_count="$(grep -c 'MARKETING_VERSION =' "$PROJECT/project.pbxproj")"

          if [[ "$(printf '%s\n' "$build_versions" | wc -l | tr -d ' ')" -ne 1 || "$build_count" -ne 4 ]]; then
            echo "::error::Die Buildnummern beider Targets und Konfigurationen sind nicht synchron."
            exit 1
          fi
          if [[ "$(printf '%s\n' "$marketing_versions" | wc -l | tr -d ' ')" -ne 1 || "$marketing_count" -ne 4 ]]; then
            echo "::error::Die Marketing-Versionen beider Targets und Konfigurationen sind nicht synchron."
            exit 1
          fi

          xcodebuild -list -project "$PROJECT"
          echo "Build $build_versions / Version $marketing_versions" | tee artifacts/project-version.txt

      - name: Enforce SwiftFormat
        run: |
          set -o pipefail
          set +e
          swiftformat \
            --lint \
            --config .swiftformat \
            --reporter github-actions-log \
            SecretMatch SecretMatchTests \
            | tee artifacts/swiftformat.log
          format_status=${PIPESTATUS[0]}
          set -e

          format_issues="$(awk '/^::(warning|error)/ { count++ } END { print count + 0 }' artifacts/swiftformat.log)"
          printf '%s\n' "$format_issues" > artifacts/swiftformat-issue-count.txt
          if [[ "$format_status" -ne 0 ]]; then
            echo "::error::SwiftFormat meldet $format_issues Abweichungen. Bitte Auto-Fix lokal ausführen und erneut committen."
            exit "$format_status"
          fi

      - name: Test CI helper scripts
        run: |
          set -euo pipefail
          Scripts/release_pr_gate_tests.sh
          Scripts/coverage_totals_tests.sh

      - name: Publish quality summary
        if: always()
        run: |
          format_issues="–"
          [[ -f artifacts/swiftformat-issue-count.txt ]] && format_issues="$(tr -d '\n' < artifacts/swiftformat-issue-count.txt)"
          {
            echo "## Code quality"
            echo
            echo "- SwiftFormat-Abweichungen: **$format_issues**"
            echo "- Projektversionen und Repository-Hygiene wurden geprüft."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-quality-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  build-participant:
    name: Build participant app
    needs: quality
    runs-on: macos-26
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build participant app
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$PARTICIPANT_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SecretMatchParticipant" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/participant-build.log | xcbeautify --renderer github-actions

      - name: Publish participant build summary
        if: success()
        run: |
          {
            echo "## Participant app"
            echo
            echo "✅ Scheme \`$PARTICIPANT_SCHEME\` wurde erfolgreich für den iOS-Simulator gebaut."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload participant build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: participant-build-log
          path: artifacts/participant-build.log
          if-no-files-found: warn
          retention-days: 14

  build-admin:
    name: Build admin app
    needs: quality
    runs-on: macos-26
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build admin app
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$ADMIN_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SecretMatchAdmin" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/admin-build.log | xcbeautify --renderer github-actions

      - name: Publish admin build summary
        if: success()
        run: |
          {
            echo "## Admin app"
            echo
            echo "✅ Scheme \`$ADMIN_SCHEME\` wurde erfolgreich für den iOS-Simulator gebaut."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload admin build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: admin-build-log
          path: artifacts/admin-build.log
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL security and quality
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build apps for CodeQL
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$PARTICIPANT_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CodeQLParticipant" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$ADMIN_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CodeQLAdmin" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze Swift security and quality
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift

      - name: Publish CodeQL summary
        if: always()
        run: |
          {
            echo "## CodeQL Security and Quality"
            echo
            echo "Die Swift-Analyse verwendet die Query-Suite \`security-and-quality\`."
            echo "Ergebnisse: **Security → Code scanning** im Repository."
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests and coverage
    needs: quality
    runs-on: macos-26
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare test reports
        run: |
          mkdir -p artifacts
          touch artifacts/tests.log

      - name: Select an available iPad simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list devices available -j | jq -r '.devices | keys | map(select(contains("iOS"))) | sort | last // empty')"
          simulator_id="$(xcrun simctl list devices available -j | jq -r --arg runtime "$runtime" '[.devices[$runtime][] | select(.name | startswith("iPad"))][0].udid // empty')"

          if [[ -z "$runtime" || -z "$simulator_id" ]]; then
            echo "::error::Kein verfügbarer iPad-Simulator gefunden."
            xcrun simctl list devices available
            exit 1
          fi

          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "Simulator-Runtime: $runtime" | tee artifacts/simulator.txt
          xcrun simctl list devices available | grep "$simulator_id" | tee -a artifacts/simulator.txt

      - name: Run complete test suite with coverage
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$PARTICIPANT_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SecretMatchTests" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/SecretMatchTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/tests.log | xcbeautify --renderer github-actions

      - name: Extract test and coverage reports
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path artifacts/SecretMatchTests.xcresult \
            > artifacts/test-summary.json
          xcrun xccov view \
            --report artifacts/SecretMatchTests.xcresult \
            --only-targets \
            | tee artifacts/coverage.txt
          xcrun xccov view \
            --report artifacts/SecretMatchTests.xcresult \
            --json \
            > artifacts/coverage.json

          read -r app_covered app_executable core_covered core_executable \
            < <(Scripts/coverage_totals.sh artifacts/coverage.json)
          if [[ "$app_executable" -eq 0 || "$core_executable" -eq 0 ]]; then
            echo "::error::Die App-Coverage konnte nicht aus dem Testbericht gelesen werden."
            exit 1
          fi

          app_coverage="$(awk -v covered="$app_covered" -v total="$app_executable" 'BEGIN { printf "%.2f", covered * 100 / total }')"
          coverage="$(awk -v covered="$core_covered" -v total="$core_executable" 'BEGIN { printf "%.2f", covered * 100 / total }')"
          printf '%s\n' "$app_coverage" > artifacts/app-coverage-percent.txt
          printf '%s\n' "$coverage" > artifacts/coverage-percent.txt

          if ! awk -v actual="$coverage" -v minimum="$COVERAGE_THRESHOLD" 'BEGIN { exit !(actual + 0 >= minimum + 0) }'; then
            echo "::error::Core Coverage ${coverage}% liegt unter dem Mindestwert von ${COVERAGE_THRESHOLD}%."
            exit 1
          fi

      - name: Publish test summary
        if: always()
        run: |
          passed_tests="–"
          failed_tests="–"
          if [[ -f artifacts/test-summary.json ]]; then
            passed_tests="$(jq -r '.passedTests // 0' artifacts/test-summary.json)"
            failed_tests="$(jq -r '.failedTests // 0' artifacts/test-summary.json)"
          fi

          coverage="–"
          [[ -f artifacts/coverage-percent.txt ]] && coverage="$(tr -d '\n' < artifacts/coverage-percent.txt)%"
          app_coverage="–"
          [[ -f artifacts/app-coverage-percent.txt ]] && app_coverage="$(tr -d '\n' < artifacts/app-coverage-percent.txt)%"
          compiler_warnings="$(awk '/warning:/ { count++ } END { print count + 0 }' artifacts/tests.log)"

          {
            echo "## Tests and coverage"
            echo
            echo "| Prüfung | Ergebnis |"
            echo "| --- | --- |"
            echo "| Tests | $passed_tests bestanden / $failed_tests fehlgeschlagen |"
            echo "| Core Coverage | $coverage · Mindestwert ${COVERAGE_THRESHOLD}% |"
            echo "| Gesamte App inklusive SwiftUI | $app_coverage · informativ |"
            echo "| Compiler | $compiler_warnings Warnungen |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-coverage-reports
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  publish-wiki:
    name: Publish documentation wiki
    needs:
      - quality
      - build-participant
      - build-admin
      - tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out documentation sources
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out wiki
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository }}.wiki"
          ref: master
          path: wiki

      - name: Synchronize documentation pages
        run: |
          set -euo pipefail

          cp source/README.md wiki/Home.md
          cp source/EVENT-NETZWERK-SETUP.md wiki/Event-Netzwerk-Setup.md
          cp source/AGENTS.md wiki/Agent-Instructions.md
          cp source/skill/agent.md wiki/Agent-Workflow.md
          cp source/skill/secretmatch-ios/SKILL.md wiki/SecretMatch-iOS-Skill.md
          cp source/skill/secretmatch-review/SKILL.md wiki/SecretMatch-Review-Skill.md
          cp source/APP-STORE-CONNECT-RELEASE.md wiki/App-Store-Connect-Release.md
          cp source/docs/business-logic/Business-Logic.md wiki/Business-Logic.md
          cp source/docs/business-logic/domain-model-and-invariants.md wiki/domain-model-and-invariants.md
          cp source/docs/business-logic/participant-authentication-and-sessions.md wiki/participant-authentication-and-sessions.md
          cp source/docs/business-logic/interactions-matches-actions.md wiki/interactions-matches-actions.md
          cp source/docs/business-logic/offline-queue-connectivity-telemetry.md wiki/offline-queue-connectivity-telemetry.md
          cp source/docs/business-logic/admin-and-access-control.md wiki/admin-and-access-control.md
          cp source/docs/business-logic/event-lifecycle-statistics-and-exports.md wiki/event-lifecycle-statistics-and-exports.md
          cp source/docs/business-logic/billboards-announcements-and-media.md wiki/billboards-announcements-and-media.md
          cp source/docs/business-logic/devices-alerts-feedback-and-privacy.md wiki/devices-alerts-feedback-and-privacy.md
          cp source/docs/business-logic/api-contracts.md wiki/api-contracts.md
          sed -i \
            -e 's|(docs/business-logic/Business-Logic.md)|(Business-Logic)|g' \
            -e 's|(APP-STORE-CONNECT-RELEASE.md)|(App-Store-Connect-Release)|g' \
            -e 's|(EVENT-NETZWERK-SETUP.md)|(Event-Netzwerk-Setup)|g' \
            wiki/Home.md
          for page in \
            wiki/Business-Logic.md \
            wiki/domain-model-and-invariants.md \
            wiki/participant-authentication-and-sessions.md \
            wiki/interactions-matches-actions.md \
            wiki/offline-queue-connectivity-telemetry.md \
            wiki/admin-and-access-control.md \
            wiki/event-lifecycle-statistics-and-exports.md \
            wiki/billboards-announcements-and-media.md \
            wiki/devices-alerts-feedback-and-privacy.md \
            wiki/api-contracts.md; do
            sed -i -E 's|\(([^)/]+)\.md\)|(\1)|g' "$page"
          done

          printf '%s\n' \
            '# SecretMatch' \
            '' \
            '- [Startseite](Home)' \
            '- [App Store Connect Release](App-Store-Connect-Release)' \
            '- **Business-Logik**' \
            '  - [Übersicht](Business-Logic)' \
            '  - [Domänenmodell und Invarianten](domain-model-and-invariants)' \
            '  - [Teilnehmer-Anmeldung und Sitzungen](participant-authentication-and-sessions)' \
            '  - [Wünsche, Matches und Aktionen](interactions-matches-actions)' \
            '  - [Offline-Queue, Verbindung und Telemetrie](offline-queue-connectivity-telemetry)' \
            '  - [Admin und Zugriffsschutz](admin-and-access-control)' \
            '  - [Event-Lebenszyklus, Statistik und Exporte](event-lifecycle-statistics-and-exports)' \
            '  - [Billboard, Mitteilungen und Medien](billboards-announcements-and-media)' \
            '  - [Geräte, Warnungen, Feedback und Datenschutz](devices-alerts-feedback-and-privacy)' \
            '  - [REST-API-Verträge](api-contracts)' \
            '- [Event-Netzwerk-Setup](Event-Netzwerk-Setup)' \
            '- [Agent Instructions](Agent-Instructions)' \
            '- [Agent Workflow](Agent-Workflow)' \
            '- [SecretMatch iOS Skill](SecretMatch-iOS-Skill)' \
            '- [SecretMatch Review Skill](SecretMatch-Review-Skill)' \
            > wiki/_Sidebar.md

      - name: Publish changed wiki pages
        run: |
          set -euo pipefail

          git -C wiki config user.name 'github-actions[bot]'
          git -C wiki config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C wiki add \
            Home.md \
            Event-Netzwerk-Setup.md \
            Agent-Instructions.md \
            Agent-Workflow.md \
            SecretMatch-iOS-Skill.md \
            SecretMatch-Review-Skill.md \
            App-Store-Connect-Release.md \
            Business-Logic.md \
            domain-model-and-invariants.md \
            participant-authentication-and-sessions.md \
            interactions-matches-actions.md \
            offline-queue-connectivity-telemetry.md \
            admin-and-access-control.md \
            event-lifecycle-statistics-and-exports.md \
            billboards-announcements-and-media.md \
            devices-alerts-feedback-and-privacy.md \
            api-contracts.md \
            _Sidebar.md

          if git -C wiki diff --cached --quiet; then
            echo 'Wiki ist bereits aktuell.'
            exit 0
          fi

          git -C wiki commit -m "Sync documentation from ${GITHUB_SHA::7}"
          git -C wiki push origin HEAD:master

      - name: Publish wiki summary
        if: always()
        run: |
          {
            echo "## Documentation wiki"
            echo
            echo "Verwaltete Markdown-Seiten wurden mit dem Repository-Wiki synchronisiert."
          } >> "$GITHUB_STEP_SUMMARY"

  release_gate:
    name: Verify merged release PR
    needs:
      - quality
      - build-participant
      - build-admin
      - tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      should_release: ${{ steps.release_pr.outputs.should_release }}
      pull_request_number: ${{ steps.release_pr.outputs.pull_request_number }}

    steps:
      - name: Check out tested release commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Find merged release pull request
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          associated_pull_requests="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls")"
          release_pull_request="$(printf '%s' "$associated_pull_requests" | Scripts/release_pr_gate.sh)"

          if [[ "$release_pull_request" == 'null' ]]; then
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            echo 'Kein gemergter Release-PR für diesen Commit gefunden.'
            exit 0
          fi

          pull_request_number="$(printf '%s' "$release_pull_request" | jq -r '.number')"
          echo 'should_release=true' >> "$GITHUB_OUTPUT"
          echo "pull_request_number=$pull_request_number" >> "$GITHUB_OUTPUT"
          echo "Release durch Pull Request #$pull_request_number freigegeben."

  app_store_upload:
    name: Upload ${{ matrix.product_name }} to App Store Connect
    needs: release_gate
    if: needs.release_gate.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: app-store-connect
      url: https://appstoreconnect.apple.com/

    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - product_name: participant-app
            scheme: SecretMatch
            archive_name: SecretMatch
          - product_name: admin-app
            scheme: SecretMatch Admin
            archive_name: SecretMatchAdmin

    defaults:
      run:
        shell: bash

    env:
      DEVELOPMENT_TEAM: BVCKM275FP
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

    steps:
      - name: Check out tested release commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate App Store Connect configuration
        run: |
          set -euo pipefail

          for required_name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "::error::GitHub Environment Secret $required_name fehlt."
              exit 1
            fi
          done

          if ! plutil -lint AppStoreExportOptions.plist; then
            echo '::error::AppStoreExportOptions.plist ist ungültig.'
            exit 1
          fi

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          key_directory="$RUNNER_TEMP/app-store-connect"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$key_directory"
          printf '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archive ${{ matrix.product_name }}
        env:
          SCHEME: ${{ matrix.scheme }}
          ARCHIVE_NAME: ${{ matrix.archive_name }}
        run: |
          set -euo pipefail

          mkdir -p artifacts
          archive_path="$RUNNER_TEMP/${ARCHIVE_NAME}.xcarchive"
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic \
            2>&1 | tee artifacts/archive.log | xcbeautify --renderer github-actions

      - name: Upload ${{ matrix.product_name }}
        run: |
          set -euo pipefail

          export_path="$RUNNER_TEMP/AppStoreExport"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_path" \
            -exportOptionsPlist AppStoreExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            2>&1 | tee artifacts/upload.log | xcbeautify --renderer github-actions

      - name: Remove temporary API key
        if: always()
        run: |
          key_path="$RUNNER_TEMP/app-store-connect/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          rm -f "$key_path"

      - name: Publish upload summary
        if: always()
        env:
          PRODUCT_NAME: ${{ matrix.product_name }}
          RELEASE_PR: ${{ needs.release_gate.outputs.pull_request_number }}
        run: |
          {
            echo "## App Store Connect · $PRODUCT_NAME"
            echo
            echo "- Release-PR: **#$RELEASE_PR**"
            echo "- Commit: \`${{ github.sha }}\`"
            if [[ "${{ job.status }}" == 'success' ]]; then
              echo '- Upload: **erfolgreich an App Store Connect übertragen**'
              echo '- Apple verarbeitet den Build anschließend asynchron für TestFlight.'
            else
              echo '- Upload: **fehlgeschlagen** – Details stehen im Archive- oder Upload-Step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-store-connect-${{ matrix.product_name }}-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
