name: iOS Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ios-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: SecretMatch.xcodeproj
  PARTICIPANT_SCHEME: SecretMatch
  ADMIN_SCHEME: SecretMatch Admin
  COVERAGE_THRESHOLD: "70.0"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  quality:
    name: Code quality
    runs-on: macos-26
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare quality report
        run: |
          mkdir -p artifacts
          touch artifacts/swiftformat.log

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftformat --version

      - name: Check repository hygiene and project versions
        run: |
          set -euo pipefail

          forbidden_files="$(git ls-files | grep -E '(^|/)xcuserdata/|\.xcuserstate$|\.p12$|\.mobileprovision$' || true)"
          if [[ -n "$forbidden_files" ]]; then
            echo "::error::Unzulässige lokale oder Signing-Dateien sind versioniert."
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

          if git grep -n -E '^(<<<<<<<|>>>>>>>)' -- '*.swift' '*.yml' '*.yaml' '*.md'; then
            echo "::error::Nicht aufgelöste Merge-Marker gefunden."
            exit 1
          fi

          build_versions="$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([^;]*\);/\1/p' "$PROJECT/project.pbxproj" | sort -u)"
          marketing_versions="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' "$PROJECT/project.pbxproj" | sort -u)"
          build_count="$(grep -c 'CURRENT_PROJECT_VERSION =' "$PROJECT/project.pbxproj")"
          marketing_count="$(grep -c 'MARKETING_VERSION =' "$PROJECT/project.pbxproj")"

          if [[ "$(printf '%s\n' "$build_versions" | wc -l | tr -d ' ')" -ne 1 || "$build_count" -ne 4 ]]; then
            echo "::error::Die Buildnummern beider Targets und Konfigurationen sind nicht synchron."
            exit 1
          fi
          if [[ "$(printf '%s\n' "$marketing_versions" | wc -l | tr -d ' ')" -ne 1 || "$marketing_count" -ne 4 ]]; then
            echo "::error::Die Marketing-Versionen beider Targets und Konfigurationen sind nicht synchron."
            exit 1
          fi

          xcodebuild -list -project "$PROJECT"
          echo "Build $build_versions / Version $marketing_versions" | tee artifacts/project-version.txt

      - name: Enforce SwiftFormat
        run: |
          set -o pipefail
          set +e
          swiftformat \
            --lint \
            --config .swiftformat \
            --reporter github-actions-log \
            SecretMatch SecretMatchTests \
            | tee artifacts/swiftformat.log
          format_status=${PIPESTATUS[0]}
          set -e

          format_issues="$(awk '/^::(warning|error)/ { count++ } END { print count + 0 }' artifacts/swiftformat.log)"
          printf '%s\n' "$format_issues" > artifacts/swiftformat-issue-count.txt
          if [[ "$format_status" -ne 0 ]]; then
            echo "::error::SwiftFormat meldet $format_issues Abweichungen. Bitte Auto-Fix lokal ausführen und erneut committen."
            exit "$format_status"
          fi

      - name: Publish quality summary
        if: always()
        run: |
          format_issues="–"
          [[ -f artifacts/swiftformat-issue-count.txt ]] && format_issues="$(tr -d '\n' < artifacts/swiftformat-issue-count.txt)"
          {
            echo "## Code quality"
            echo
            echo "- SwiftFormat-Abweichungen: **$format_issues**"
            echo "- Projektversionen und Repository-Hygiene wurden geprüft."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-quality-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  build-participant:
    name: Build participant app
    needs: quality
    runs-on: macos-26
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build participant app
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$PARTICIPANT_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SecretMatchParticipant" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/participant-build.log | xcbeautify --renderer github-actions

      - name: Publish participant build summary
        if: success()
        run: |
          {
            echo "## Participant app"
            echo
            echo "✅ Scheme \`$PARTICIPANT_SCHEME\` wurde erfolgreich für den iOS-Simulator gebaut."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload participant build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: participant-build-log
          path: artifacts/participant-build.log
          if-no-files-found: warn
          retention-days: 14

  build-admin:
    name: Build admin app
    needs: quality
    runs-on: macos-26
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build admin app
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$ADMIN_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SecretMatchAdmin" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/admin-build.log | xcbeautify --renderer github-actions

      - name: Publish admin build summary
        if: success()
        run: |
          {
            echo "## Admin app"
            echo
            echo "✅ Scheme \`$ADMIN_SCHEME\` wurde erfolgreich für den iOS-Simulator gebaut."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload admin build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: admin-build-log
          path: artifacts/admin-build.log
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL security and quality
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build apps for CodeQL
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$PARTICIPANT_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CodeQLParticipant" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$ADMIN_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CodeQLAdmin" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze Swift security and quality
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift

      - name: Publish CodeQL summary
        if: always()
        run: |
          {
            echo "## CodeQL Security and Quality"
            echo
            echo "Die Swift-Analyse verwendet die Query-Suite \`security-and-quality\`."
            echo "Ergebnisse: **Security → Code scanning** im Repository."
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests and coverage
    needs: quality
    runs-on: macos-26
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare test reports
        run: |
          mkdir -p artifacts
          touch artifacts/tests.log

      - name: Select an available iPad simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list devices available -j | jq -r '.devices | keys | map(select(contains("iOS"))) | sort | last // empty')"
          simulator_id="$(xcrun simctl list devices available -j | jq -r --arg runtime "$runtime" '[.devices[$runtime][] | select(.name | startswith("iPad"))][0].udid // empty')"

          if [[ -z "$runtime" || -z "$simulator_id" ]]; then
            echo "::error::Kein verfügbarer iPad-Simulator gefunden."
            xcrun simctl list devices available
            exit 1
          fi

          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "Simulator-Runtime: $runtime" | tee artifacts/simulator.txt
          xcrun simctl list devices available | grep "$simulator_id" | tee -a artifacts/simulator.txt

      - name: Run complete test suite with coverage
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$PARTICIPANT_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SecretMatchTests" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/SecretMatchTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/tests.log | xcbeautify --renderer github-actions

      - name: Extract test and coverage reports
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path artifacts/SecretMatchTests.xcresult \
            > artifacts/test-summary.json
          xcrun xccov view \
            --report artifacts/SecretMatchTests.xcresult \
            --only-targets \
            | tee artifacts/coverage.txt
          xcrun xccov view \
            --report artifacts/SecretMatchTests.xcresult \
            --json \
            > artifacts/coverage.json

          coverage="$(awk '$2 == "SecretMatch.app" { value = $4; gsub(/%/, "", value); print value }' artifacts/coverage.txt)"
          if [[ -z "$coverage" ]]; then
            echo "::error::Die App-Coverage konnte nicht aus dem Testbericht gelesen werden."
            exit 1
          fi
          printf '%s\n' "$coverage" > artifacts/coverage-percent.txt

          if ! awk -v actual="$coverage" -v minimum="$COVERAGE_THRESHOLD" 'BEGIN { exit !(actual + 0 >= minimum + 0) }'; then
            echo "::error::Code Coverage ${coverage}% liegt unter dem Mindestwert von ${COVERAGE_THRESHOLD}%."
            exit 1
          fi

      - name: Publish test summary
        if: always()
        run: |
          passed_tests="–"
          failed_tests="–"
          if [[ -f artifacts/test-summary.json ]]; then
            passed_tests="$(jq -r '.passedTests // 0' artifacts/test-summary.json)"
            failed_tests="$(jq -r '.failedTests // 0' artifacts/test-summary.json)"
          fi

          coverage="–"
          [[ -f artifacts/coverage-percent.txt ]] && coverage="$(tr -d '\n' < artifacts/coverage-percent.txt)%"
          compiler_warnings="$(awk '/warning:/ { count++ } END { print count + 0 }' artifacts/tests.log)"

          {
            echo "## Tests and coverage"
            echo
            echo "| Prüfung | Ergebnis |"
            echo "| --- | --- |"
            echo "| Tests | $passed_tests bestanden / $failed_tests fehlgeschlagen |"
            echo "| Zeilenabdeckung | $coverage · Mindestwert ${COVERAGE_THRESHOLD}% |"
            echo "| Compiler | $compiler_warnings Warnungen |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-coverage-reports
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  publish-wiki:
    name: Publish documentation wiki
    needs:
      - quality
      - build-participant
      - build-admin
      - tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out documentation sources
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Check out wiki
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository }}.wiki"
          ref: master
          path: wiki

      - name: Synchronize documentation pages
        run: |
          set -euo pipefail

          cp source/README.md wiki/Home.md
          cp source/EVENT-NETZWERK-SETUP.md wiki/Event-Netzwerk-Setup.md
          cp source/AGENTS.md wiki/Agent-Instructions.md
          cp source/skill/agent.md wiki/Agent-Workflow.md
          cp source/skill/secretmatch-ios/SKILL.md wiki/SecretMatch-iOS-Skill.md
          cp source/skill/secretmatch-review/SKILL.md wiki/SecretMatch-Review-Skill.md

          printf '%s\n' \
            '# SecretMatch' \
            '' \
            '- [Startseite](Home)' \
            '- [Event-Netzwerk-Setup](Event-Netzwerk-Setup)' \
            '- [Agent Instructions](Agent-Instructions)' \
            '- [Agent Workflow](Agent-Workflow)' \
            '- [SecretMatch iOS Skill](SecretMatch-iOS-Skill)' \
            '- [SecretMatch Review Skill](SecretMatch-Review-Skill)' \
            > wiki/_Sidebar.md

      - name: Publish changed wiki pages
        run: |
          set -euo pipefail

          git -C wiki config user.name 'github-actions[bot]'
          git -C wiki config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C wiki add \
            Home.md \
            Event-Netzwerk-Setup.md \
            Agent-Instructions.md \
            Agent-Workflow.md \
            SecretMatch-iOS-Skill.md \
            SecretMatch-Review-Skill.md \
            _Sidebar.md

          if git -C wiki diff --cached --quiet; then
            echo 'Wiki ist bereits aktuell.'
            exit 0
          fi

          git -C wiki commit -m "Sync documentation from ${GITHUB_SHA::7}"
          git -C wiki push origin HEAD:master

      - name: Publish wiki summary
        if: always()
        run: |
          {
            echo "## Documentation wiki"
            echo
            echo "Verwaltete Markdown-Seiten wurden mit dem Repository-Wiki synchronisiert."
          } >> "$GITHUB_STEP_SUMMARY"
