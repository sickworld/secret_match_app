included:
  - SecretMatch
  - SecretMatchTests

excluded:
  - SecretMatch/Assets.xcassets

opt_in_rules:
  - contains_over_filter_count
  - empty_count
  - empty_string
  - first_where

line_length:
  warning: 180
  error: 300
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 150
  error: 300

type_body_length:
  warning: 1000
  error: 1600

file_length:
  warning: 1800
  error: 3200

cyclomatic_complexity:
  warning: 20
  error: 40
